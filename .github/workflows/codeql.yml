name: CodeQL

# Static analysis for the C++ client on every push to the two branches that matter, every pull
# request, and weekly. Build mode is `none`: the fork's Qt 6.11.2 build is expensive and already
# runs in seathub-build-win.yml, and CodeQL's C++ analysis supports scanning without a build.
# The action is pinned to a commit by pinact; Dependabot moves the pin.

on:
  push:
    branches: [main, seathub/v3.0-phase1]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C++
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
        with:
          languages: c-cpp
          build-mode: none

      - uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
        with:
          category: '/language:c-cpp'
