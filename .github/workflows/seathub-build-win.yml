name: SeatHub build (Windows)

# Adds SeatHub-specific jobs alongside upstream's existing CI (D-27) — upstream workflows are the
# baseline and are not removed until SeatHub jobs fully cover them. This job's purpose is the
# diff gate: it enforces the engine-untouched fork boundary (D-28, amended by ADR-0046).
#
# Exception pattern: `overlaymanager|session\.cpp` is the single source of truth for what may be
# modified under app/streaming/. It is deliberately mirrored (not referenced) in three other
# places — the verify commands of Plans 03-02, 03-05, and 03-06 — because those verify commands
# run outside CI, in the executor's own shell, before a PR exists to run this workflow against.
# Any future amendment to the exception set must update all four locations together.

on:
  pull_request:
    branches: [seathub/main]
  push:
    branches: [seathub/main]

jobs:
  diff-gate:
    name: Engine-untouched diff gate (D-28, ADR-0046)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tag baseline
        run: git fetch --tags --force origin v6.1.0

      - name: Fail if any engine file (decoder/renderer/audio/input) changed
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only v6.1.0..HEAD -- \
            'app/streaming/video/*' 'app/streaming/audio/*' 'app/streaming/input/*' \
            'app/streaming/*.cpp' 'app/streaming/*.h')
          if [ -z "$CHANGED" ]; then
            echo "No app/streaming/ files changed — gate passes trivially."
            exit 0
          fi
          echo "Changed app/streaming/ files:"
          echo "$CHANGED"
          # The only two permitted exceptions (D-28's overlay compositor, ADR-0046's session.cpp
          # title literal). This regex is the single source; see the header comment above.
          DISALLOWED=$(echo "$CHANGED" | grep -Ev 'overlaymanager|session\.cpp' || true)
          if [ -n "$DISALLOWED" ]; then
            echo "::error::Disallowed engine file(s) modified outside the FORK-CHANGES.md exception list:"
            echo "$DISALLOWED"
            exit 1
          fi
          echo "Only exception-listed files changed under app/streaming/ — gate passes."

      - name: Fail if a changed exception file has no FORK-CHANGES.md entry
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only v6.1.0..HEAD -- \
            'app/streaming/video/*' 'app/streaming/audio/*' 'app/streaming/input/*' \
            'app/streaming/*.cpp' 'app/streaming/*.h' | grep -E 'overlaymanager|session\.cpp' || true)
          if [ -z "$CHANGED" ]; then
            exit 0
          fi
          MISSING=""
          for f in $CHANGED; do
            grep -qF "$f" FORK-CHANGES.md || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::These exception-listed files changed but have no FORK-CHANGES.md entry:$MISSING"
            exit 1
          fi

  seathub-windows-build:
    name: SeatHub Windows/Qt build
    runs-on: windows-latest
    needs: diff-gate
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Toolchain. Plan 03-01 left this as a placeholder rather than guess at provisioning, and
      # Plan 03-06 replaces it now that the recipe is proven on a real machine. Qt and the Qt
      # Installer Framework are installed with aqtinstall, whose layout is the same one the Qt
      # Online Installer writes, so the paths below match scripts\build-seathub.ps1's defaults and
      # the install paths pinned in seathub-ops/pins.yaml.
      #
      # MSVC is not provisioned: windows-latest already carries Visual Studio 2022 with the
      # Desktop C++ workload, and the script finds vcvars64.bat for an install that actually has
      # the VC toolset - via vswhere with -requires, which is the check upstream's build-arch.bat
      # omits.
      # aqtinstall is taken from git, not PyPI, and that is not a preference. Qt changed its
      # repository layout at 6.11: there is no longer a second `qt6_6112` folder inside the first
      # one, each architecture subfolder carries its own Updates.xml instead
      # (miurahr/aqtinstall#959). Released aqtinstall still looks for the old path and answers
      # "Failed to locate XML data for Qt version '6.11.2'". The fix is miurahr/aqtinstall#1000,
      # merged 2026-03-24; the newest release, v3.3.0, is from 2025-06-02 and predates it, so
      # `pip install aqtinstall` cannot get it at any version. Pinned to a commit rather than
      # `@master` so this build is reproducible; revisit when a release above v3.3.0 ships.
      #
      # `qtsvg` is deliberately NOT in -m. It is a Qt Essential and arrives in the base install
      # (it is listed by `aqt list-qt windows desktop --archives 6.11.2 win64_msvc2022_64`), so
      # naming it as a module fails with "The packages ['qtsvg'] were not found". That error was
      # invisible until the version error above was fixed, because it never got that far.
      - name: Install Qt 6.11.2 (MSVC 2022 x64) and Qt Installer Framework
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Every call is checked explicitly. A native command that exits non-zero does not stop a
          # pwsh run block on its own, which is how a failed Qt install previously reported success
          # and left the build two minutes later saying only "Qt directory not found".
          python -m pip install --disable-pip-version-check "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall could not be installed." }
          python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 -m qtwebsockets -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt 6.11.2 install failed." }
          # Pinned to 4.7 because build-seathub.ps1 defaults -IfwDir to
          # C:\Qt\Tools\QtInstallerFramework\4.7. Unpinned, aqt installs whatever is current, and the day Qt
          # ships 4.8 this breaks with "Qt Installer Framework directory not found" and
          # reads as a new bug rather than a version bump.
          python -m aqt install-tool windows desktop tools_ifw qt.tools.ifw.47 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt Installer Framework install failed." }
          if (-not (Test-Path -LiteralPath 'C:\Qt\6.11.2\msvc2022_64')) {
            throw "Qt reported success but C:\Qt\6.11.2\msvc2022_64 does not exist."
          }

      - name: Build, deploy and package SeatHub
        shell: pwsh
        run: ./scripts/build-seathub.ps1

      - name: Record the installer hash
        shell: pwsh
        run: |
          Get-Content build\installer-x64-release\sha256.txt
          Write-Output "Publish with POST /api/admin/releases (D-40); see docs/runbooks/client-release.md in the monorepo."

      - uses: actions/upload-artifact@v4
        with:
          name: SeatHub-Setup
          path: build\installer-x64-release\SeatHub-Setup-*.exe
          if-no-files-found: error

      # NOT YET EXERCISED: this job has not been run. It is the proven local recipe wired into CI,
      # and the first CI run is what confirms the runner's Qt layout and MSVC discovery. Until then
      # the local `pwsh -File scripts\build-seathub.ps1` is the recipe of record.
