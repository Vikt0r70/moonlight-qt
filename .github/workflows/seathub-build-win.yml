name: SeatHub build (Windows)

# Adds SeatHub-specific jobs alongside upstream's existing CI (D-27) — upstream workflows are the
# baseline and are not removed until SeatHub jobs fully cover them. This job's purpose is the
# diff gate: it enforces the engine-untouched fork boundary (D-28, amended by ADR-0046).
#
# Exception pattern: `overlaymanager|session\.cpp` is the single source of truth for what may be
# modified under app/streaming/. It is deliberately mirrored (not referenced) in three other
# places — the verify commands of Plans 03-02, 03-05, and 03-06 — because those verify commands
# run outside CI, in the executor's own shell, before a PR exists to run this workflow against.
# Any future amendment to the exception set must update all four locations together.

on:
  pull_request:
    branches: [seathub/main]
  push:
    branches: [seathub/main]

jobs:
  diff-gate:
    name: Engine-untouched diff gate (D-28, ADR-0046)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tag baseline
        run: git fetch --tags --force origin v6.1.0

      - name: Fail if any engine file (decoder/renderer/audio/input) changed
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only v6.1.0..HEAD -- \
            'app/streaming/video/*' 'app/streaming/audio/*' 'app/streaming/input/*' \
            'app/streaming/*.cpp' 'app/streaming/*.h')
          if [ -z "$CHANGED" ]; then
            echo "No app/streaming/ files changed — gate passes trivially."
            exit 0
          fi
          echo "Changed app/streaming/ files:"
          echo "$CHANGED"
          # The only two permitted exceptions (D-28's overlay compositor, ADR-0046's session.cpp
          # title literal). This regex is the single source; see the header comment above.
          DISALLOWED=$(echo "$CHANGED" | grep -Ev 'overlaymanager|session\.cpp' || true)
          if [ -n "$DISALLOWED" ]; then
            echo "::error::Disallowed engine file(s) modified outside the FORK-CHANGES.md exception list:"
            echo "$DISALLOWED"
            exit 1
          fi
          echo "Only exception-listed files changed under app/streaming/ — gate passes."

      - name: Fail if a changed exception file has no FORK-CHANGES.md entry
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only v6.1.0..HEAD -- \
            'app/streaming/video/*' 'app/streaming/audio/*' 'app/streaming/input/*' \
            'app/streaming/*.cpp' 'app/streaming/*.h' | grep -E 'overlaymanager|session\.cpp' || true)
          if [ -z "$CHANGED" ]; then
            exit 0
          fi
          MISSING=""
          for f in $CHANGED; do
            grep -qF "$f" FORK-CHANGES.md || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::These exception-listed files changed but have no FORK-CHANGES.md entry:$MISSING"
            exit 1
          fi

  seathub-windows-build:
    name: SeatHub Windows/Qt build
    runs-on: windows-latest
    needs: diff-gate
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Toolchain. Plan 03-01 left this as a placeholder rather than guess at provisioning, and
      # Plan 03-06 replaces it now that the recipe is proven on a real machine. Qt and the Qt
      # Installer Framework are installed with aqtinstall, whose layout is the same one the Qt
      # Online Installer writes, so the paths below match scripts\build-seathub.ps1's defaults and
      # the install paths pinned in seathub-ops/pins.yaml.
      #
      # MSVC is not provisioned: windows-latest already carries Visual Studio 2022 with the
      # Desktop C++ workload, and the script finds vcvars64.bat for an install that actually has
      # the VC toolset - via vswhere with -requires, which is the check upstream's build-arch.bat
      # omits.
      # aqtinstall is taken from git, not PyPI, and that is not a preference. Qt changed its
      # repository layout at 6.11: there is no longer a second `qt6_6112` folder inside the first
      # one, each architecture subfolder carries its own Updates.xml instead
      # (miurahr/aqtinstall#959). Released aqtinstall still looks for the old path and answers
      # "Failed to locate XML data for Qt version '6.11.2'". The fix is miurahr/aqtinstall#1000,
      # merged 2026-03-24; the newest release, v3.3.0, is from 2025-06-02 and predates it, so
      # `pip install aqtinstall` cannot get it at any version. Pinned to a commit rather than
      # `@master` so this build is reproducible; revisit when a release above v3.3.0 ships.
      #
      # `qtsvg` is deliberately NOT in -m. It is a Qt Essential and arrives in the base install
      # (it is listed by `aqt list-qt windows desktop --archives 6.11.2 win64_msvc2022_64`), so
      # naming it as a module fails with "The packages ['qtsvg'] were not found". That error was
      # invisible until the version error above was fixed, because it never got that far.
      - name: Install Qt 6.11.2 (MSVC 2022 x64) and Qt Installer Framework
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Every call is checked explicitly. A native command that exits non-zero does not stop a
          # pwsh run block on its own, which is how a failed Qt install previously reported success
          # and left the build two minutes later saying only "Qt directory not found".
          python -m pip install --disable-pip-version-check "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall could not be installed." }
          python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 -m qtwebsockets -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt 6.11.2 install failed." }
          # Pinned to 4.7 because build-seathub.ps1 defaults -IfwDir to
          # C:\Qt\Tools\QtInstallerFramework\4.7. Unpinned, aqt installs whatever is current, and the day Qt
          # ships 4.8 this breaks with "Qt Installer Framework directory not found" and
          # reads as a new bug rather than a version bump.
          python -m aqt install-tool windows desktop tools_ifw qt.tools.ifw.47 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt Installer Framework install failed." }
          if (-not (Test-Path -LiteralPath 'C:\Qt\6.11.2\msvc2022_64')) {
            throw "Qt reported success but C:\Qt\6.11.2\msvc2022_64 does not exist."
          }

      # Cache the built sentry-native install (06.3.1 D-02, D-18, ADR-0063): build-seathub.ps1
      # itself skips the build when this directory already has sentry.h (cache hit), so this step
      # only needs to restore/save the folder. Keyed on the script's own hash so a change to the
      # cmake configure line (or the pinned sentry-native version living inside it) invalidates the
      # cache instead of reusing a stale build.
      - name: Cache sentry-native 0.17.1 (crashpad)
        uses: actions/cache@v4
        with:
          path: build/sentry-native-0.17.1/install
          key: sentry-native-0.17.1-${{ hashFiles('scripts/build-seathub.ps1') }}-msvc

      - name: Build, deploy and package SeatHub
        shell: pwsh
        run: ./scripts/build-seathub.ps1

      # ADR-0063, D-01/SC-10, D-12: runs for every build. No DSN may ever be compiled into what
      # ships (a DSN can only submit events, but D-45 still forbids shipping one), and no PDB may
      # ever ship to a customer PC -- symbols reach Sentry through the upload step below instead.
      - name: No DSN in what ships
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deployDir = 'build\deploy-x64-release'

          $shippedPdbs = Get-ChildItem -Path $deployDir -Filter '*.pdb' -Recurse -ErrorAction SilentlyContinue
          if ($shippedPdbs) {
            $shippedPdbs | ForEach-Object { Write-Host "shipped PDB: $($_.FullName)" }
            throw "$deployDir must never hold a .pdb -- no PDBs on customer PCs (D-12)"
          }

          # MEASURED (a same-fix-set CI run, 2026-09-26): a plain substring match on the bare host
          # ('ingest.de.sentry.io') is a false positive here. app/seathub/telemetry.cpp's own
          # acceptDsn() legitimately compiles in that exact string as a Latin1 literal
          # (url.host().endsWith(".ingest.de.sentry.io")) -- the validation rule that decides
          # whether a run-time-handed-out DSN is one this build will trust, not an embedded secret.
          # A real DSN always has the shape scheme://<public_key>@<host>/<project_id> (Sentry's own
          # DSN format), so the guard requires the '@' that only an actual embedded DSN carries
          # immediately before the ingest host, which the bare validation-suffix string never has.
          $dsnPattern = '@[A-Za-z0-9._-]{1,80}\.ingest\.(de\.)?sentry\.io'
          $shippedBinaries = Get-ChildItem -Path $deployDir -Include '*.exe', '*.dll' -Recurse -ErrorAction SilentlyContinue
          foreach ($bin in $shippedBinaries) {
            if (Select-String -LiteralPath $bin.FullName -Pattern $dsnPattern -Quiet) {
              throw "$($bin.FullName) contains what looks like a compiled-in Sentry DSN (matches $dsnPattern) -- no DSN may be compiled in (D-01, SC-10)"
            }
          }
          Write-Host "no PDB in $deployDir, and no Sentry DSN is compiled into any shipped exe/dll"

      # ADR-0063, D-12: every CI build uploads SeatHub's debug symbols to Sentry, so a crash is a
      # readable stack, not an address. A Sentry-side refusal (wrong project slug, wrong region)
      # must not stop the build from shipping -- it warns instead, mirroring hosthub.yml's own fix
      # (main repo commit de6217c) for the identical "Project not found" failure mode. The token
      # is read only through env, never placed on a command line or echoed.
      - name: Upload SeatHub's symbols to Sentry
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: space-desk
          SENTRY_PROJECT: seathub
          SENTRY_URL: https://de.sentry.io
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:SENTRY_AUTH_TOKEN) {
            if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
              Write-Host "::warning::Sentry symbol upload skipped: SENTRY_AUTH_TOKEN is not set; skipping the symbol upload on this pull request."
              exit 0
            }
            throw "SENTRY_AUTH_TOKEN is empty on a push to seathub/main -- the owner's secret (A-44) is missing or was revoked (D-12)"
          }

          $sentryCliSha256 = '2257cf6805a616f5c3ee291a549ebbba021190048b646adc006beb4e8cdef7fd'
          $sentryCliUrl = 'https://github.com/getsentry/sentry-cli/releases/download/3.8.0/sentry-cli-Windows-x86_64.exe'
          Write-Host "downloading $sentryCliUrl"
          Invoke-WebRequest -Uri $sentryCliUrl -OutFile sentry-cli.exe

          $actualHash = (Get-FileHash -LiteralPath sentry-cli.exe -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $sentryCliSha256) {
            throw "sentry-cli hash mismatch. expected $sentryCliSha256, got $actualHash"
          }
          Write-Host "sentry-cli 3.8.0 SHA-256 matches the pin."

          $sentryInstallBin = 'build\sentry-native-0.17.1\install\bin'
          $filesToCheck = @(
            'build\build-x64-release\app\release\SeatHub.pdb',
            (Join-Path $sentryInstallBin 'sentry.pdb'),
            (Join-Path $sentryInstallBin 'crashpad_handler.pdb'),
            (Join-Path $sentryInstallBin 'crashpad_wer.pdb')
          )

          # Collected, not hardcoded: a rebuild changes every debug id, and --require-all below
          # must be handed the ids this exact build actually produced.
          $debugIds = @()
          foreach ($pdbPath in $filesToCheck) {
            if (-not (Test-Path -LiteralPath $pdbPath)) { throw "$pdbPath does not exist to check" }
            $checkText = (& ./sentry-cli.exe debug-files check $pdbPath 2>&1 | Out-String)
            Write-Host $checkText
            if ($checkText -notmatch 'Usable: yes') {
              throw "$pdbPath is not a usable debug file (sentry-cli debug-files check)"
            }
            $idMatch = [regex]::Match($checkText, 'Debug ID:\s*([0-9a-fA-F-]+)')
            if (-not $idMatch.Success) { throw "could not read a debug id for $pdbPath from: $checkText" }
            $debugIds += $idMatch.Groups[1].Value
          }
          Write-Host "debug ids: $($debugIds -join ', ')"

          $idArgs = @()
          foreach ($id in $debugIds) { $idArgs += '--id'; $idArgs += $id }

          # The two trees that must contain the four ids above: SeatHub's own build output, and
          # sentry-native's installed bin (sentry.dll, crashpad_handler.exe, crashpad_wer.dll and
          # their PDBs). --require-all only fails when one of these four named ids is missing from
          # what --id searches for here -- it does not, by itself, cause anything else in these
          # trees or in libs\windows\lib\x64 to upload (MEASURED: sentry-cli's own --id is a
          # positive filter, not merely a presence check; every debug file whose id is not in the
          # --id list is dropped from this call's upload set, logged as "Invalid debug ID" even
          # when the file itself parses fine). That is why the prebuilt libraries' PDBs get their
          # own unrestricted call below.
          $uploadPaths = @(
            'build\build-x64-release',
            $sentryInstallBin
          )

          $uploadFailed = $false
          & ./sentry-cli.exe debug-files upload --org $env:SENTRY_ORG --project $env:SENTRY_PROJECT --wait --require-all @idArgs @uploadPaths
          if ($LASTEXITCODE -ne 0) {
            $uploadFailed = $true
            Write-Host "::warning::Sentry symbol upload failed: sentry-cli debug-files upload of SeatHub.pdb/sentry.pdb/crashpad_handler.pdb/crashpad_wer.pdb failed with exit code $LASTEXITCODE; check the project slug and region (06.3.1 owner step). The build still ships -- rigs need the installer more than Sentry needs the symbols."
          } else {
            Write-Host "uploaded SeatHub's own symbols to Sentry"
          }

          # J.1: the prebuilt libraries submodule (SDL2, FFmpeg, dav1d, libplacebo, OpenSSL, opus,
          # discord-rpc) ships its own PDBs, and every one of them carries a debug id no --id list
          # above ever names -- there is no way to know them ahead of a build, so this call has no
          # --id and no --require-all: it uploads whatever valid debug files sentry-cli finds under
          # libs\windows\lib\x64, however many that turns out to be, and only warns if the call
          # itself fails.
          & ./sentry-cli.exe debug-files upload --org $env:SENTRY_ORG --project $env:SENTRY_PROJECT --wait 'libs\windows\lib\x64'
          if ($LASTEXITCODE -ne 0) {
            $uploadFailed = $true
            Write-Host "::warning::Sentry symbol upload failed: sentry-cli debug-files upload of the prebuilt libraries' PDBs (libs\windows\lib\x64) failed with exit code $LASTEXITCODE; check the project slug and region (06.3.1 owner step). The build still ships -- rigs need the installer more than Sentry needs the symbols."
          } else {
            Write-Host "uploaded the prebuilt libraries' symbols to Sentry"
          }

          if ($uploadFailed) { exit 0 }

      - name: Record the installer hash
        shell: pwsh
        run: |
          Get-Content build\installer-x64-release\sha256.txt
          Write-Output "Publish with POST /api/admin/releases (D-40); see docs/runbooks/client-release.md in the monorepo."

      - uses: actions/upload-artifact@v4
        with:
          name: SeatHub-Setup
          path: build\installer-x64-release\SeatHub-Setup-*.exe
          if-no-files-found: error

      # NOT YET EXERCISED: this job has not been run. It is the proven local recipe wired into CI,
      # and the first CI run is what confirms the runner's Qt layout and MSVC discovery. Until then
      # the local `pwsh -File scripts\build-seathub.ps1` is the recipe of record.

  # Publish the freshly built client to the release feed (Phase 3 UAT test 8 / D-40, ADR-0026).
  # Mirrors the control repo's owner-app.yml publish job. The client is verified by checksum only
  # (D-43): no signature is sent, and the feed row's signature stays null. Publishing sets this row
  # `is_current` and clears the previous one in a single transaction (see app/releases.py), so this
  # supersedes the retired Tauri `client` row without a manual delete.
  #
  # Only runs on a push to seathub/main (never on PRs). If the release secrets are not set on this
  # repo yet, the build still succeeds and this job SKIPS with a loud warning rather than failing red
  # — set the five secrets below to turn publishing on.
  publish:
    name: Publish client to the release feed
    needs: seathub-windows-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/seathub/main'
    # `contents: write` is only for the GitHub Release at the end (owner decision A-22).
    permissions:
      contents: write
    concurrency:
      group: client-app-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SeatHub-Setup
          path: dist

      - name: Check the release credentials are present
        id: creds
        env:
          CONTROL_URL: ${{ secrets.SEATHUB_CONTROL_URL }}
          RELEASE_USER: ${{ secrets.SEATHUB_RELEASE_USER }}
          RELEASE_PASSWORD: ${{ secrets.SEATHUB_RELEASE_PASSWORD }}
          VPS: ${{ secrets.SEATHUB_VPS_HOST }}
          VPS_KEY: ${{ secrets.SEATHUB_VPS_KEY }}
        run: |
          missing=""
          [ -n "$CONTROL_URL" ] || missing="$missing SEATHUB_CONTROL_URL"
          [ -n "$RELEASE_USER" ] || missing="$missing SEATHUB_RELEASE_USER"
          [ -n "$RELEASE_PASSWORD" ] || missing="$missing SEATHUB_RELEASE_PASSWORD"
          [ -n "$VPS" ] || missing="$missing SEATHUB_VPS_HOST"
          [ -n "$VPS_KEY" ] || missing="$missing SEATHUB_VPS_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Client publish skipped. Set these secrets on this repo to enable it:$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the installer and version
        id: artifact
        if: steps.creds.outputs.ok == 'true'
        run: |
          set -euo pipefail
          file=$(ls dist/SeatHub-Setup-*.exe | head -1 || true)
          [ -n "$file" ] || { echo "::error::No SeatHub-Setup-*.exe in the build artifact"; exit 1; }
          base=$(basename "$file")
          version=$(echo "$base" | sed -E 's/^SeatHub-Setup-(.+)\.exe$/\1/')
          echo "installer=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Installer: $base (version $version)"

      - name: Set up the deploy key
        if: steps.creds.outputs.ok == 'true'
        env:
          VPS: ${{ secrets.SEATHUB_VPS_HOST }}
          VPS_KEY: ${{ secrets.SEATHUB_VPS_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ ! -s ~/.ssh/id_ed25519 ]; then
            echo "::error::SEATHUB_VPS_KEY is empty. Set it from the private key file: gh secret set SEATHUB_VPS_KEY --repo Vikt0r70/moonlight-qt < path/to/key"
            exit 1
          fi
          # ssh-keyscan is best-effort host-key pre-seeding; a failure must NOT abort the job (the
          # step runs under `bash -e`). StrictHostKeyChecking=accept-new on the ssh/scp calls below
          # covers first contact either way.
          host="${VPS##*@}"; host="${host%%[[:space:]]*}"
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || echo "::warning::ssh-keyscan could not pre-seed the host key; relying on accept-new."

      - name: Upload the installer to the VPS
        if: steps.creds.outputs.ok == 'true'
        env:
          VPS: ${{ secrets.SEATHUB_VPS_HOST }}
          INSTALLER: ${{ steps.artifact.outputs.installer }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$VPS" 'mkdir -p ~/seathub/downloads'
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new "dist/$INSTALLER" "$VPS:~/seathub/downloads/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$VPS" "chmod 644 ~/seathub/downloads/'$INSTALLER'"

      - name: Prove the download works
        if: steps.creds.outputs.ok == 'true'
        env:
          CONTROL_URL: ${{ secrets.SEATHUB_CONTROL_URL }}
          INSTALLER: ${{ steps.artifact.outputs.installer }}
        run: |
          set -euo pipefail
          url="$CONTROL_URL/downloads/$INSTALLER"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -I "$url")
          if [ "$code" != "200" ]; then
            echo "::error::$url answered $code. The API container may have started before ~/seathub/downloads existed; re-run deploy.yml to restart it."
            exit 1
          fi
          echo "$url is reachable"

      - name: Put this build in the client release feed
        if: steps.creds.outputs.ok == 'true'
        env:
          CONTROL_URL: ${{ secrets.SEATHUB_CONTROL_URL }}
          RELEASE_USER: ${{ secrets.SEATHUB_RELEASE_USER }}
          RELEASE_PASSWORD: ${{ secrets.SEATHUB_RELEASE_PASSWORD }}
          INSTALLER: ${{ steps.artifact.outputs.installer }}
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          # Excerpt of a server reply that is safe to log: credentials struck out, echoed input/ctx
          # keys dropped, one line, cut to 300 chars.
          snippet() {
            if [ ! -s "$1" ]; then echo "(empty body)"; return; fi
            jq -Rrs --arg u "$RELEASE_USER" --arg p "$RELEASE_PASSWORD" '
              def strike($v): if $v == "" then . else split($v) | join("[redacted]") end;
              def strikeboth($v): strike($v | @json | .[1:-1]) | strike($v);
              strikeboth($u) | strikeboth($p)
              | . as $text
              | (try (fromjson | walk(if type == "object" then del(.input, .ctx) else . end) | tojson) catch $text)
              | gsub("[\r\n]+"; " ") | .[0:300]' "$1" || echo "(unreadable body)"
          }
          status=$(curl -sS -o "$tmp/login.json" -w '%{http_code}' -X POST "$CONTROL_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg i "$RELEASE_USER" --arg p "$RELEASE_PASSWORD" '{identifier: $i, password: $p}')" 2>/dev/null) || {
            echo "::error::Could not reach the control plane to sign in (curl exit $?)."; exit 1; }
          if [ "$status" != "200" ]; then
            echo "::error::Sign-in as the release account was refused (HTTP $status): \"$(snippet "$tmp/login.json")\". SEATHUB_RELEASE_USER must be the operator's EMAIL and SEATHUB_RELEASE_PASSWORD its current password."
            exit 1
          fi
          token=$(jq -r '.access_token // empty' "$tmp/login.json") || token=""
          [ -n "$token" ] || { echo "::error::Signed in but the reply carried no access_token."; exit 1; }

          digest=$(shasum -a 256 "dist/$INSTALLER" | awk '{print $1}')
          # D-43: checksum-only, no signature field.
          body=$(jq -n \
            --arg version "$VERSION" \
            --arg url "$CONTROL_URL/downloads/$INSTALLER" \
            --arg sha256 "$digest" \
            --arg notes "SeatHub client $VERSION" \
            '{app: "client", version: $version, url: $url, sha256: $sha256, notes: $notes}')
          status=$(curl -sS -o "$tmp/publish.json" -w '%{http_code}' -X POST "$CONTROL_URL/api/operator/releases" \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $token" \
            -d "$body" 2>/dev/null) || { echo "::error::Could not reach the control plane to publish (curl exit $?)."; exit 1; }
          if [ "$status" != "201" ]; then
            echo "::error::Publishing the client was refused (HTTP $status): \"$(snippet "$tmp/publish.json")\""
            exit 1
          fi
          echo "Published client $(jq -r '.version' "$tmp/publish.json") -> $(jq -r '.url' "$tmp/publish.json")"

      - name: Read the feed back as the client would
        if: steps.creds.outputs.ok == 'true'
        env:
          CONTROL_URL: ${{ secrets.SEATHUB_CONTROL_URL }}
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          set -euo pipefail
          feed=$(curl -sS "$CONTROL_URL/api/releases/client")
          echo "$feed" | jq .
          [ "$(echo "$feed" | jq -r '.version')" = "$VERSION" ] || { echo "::error::feed is not serving $VERSION"; exit 1; }
          [ "$(echo "$feed" | jq -r '.sha256')" != "null" ] || { echo "::error::feed row has no sha256, so no installed client can verify this build"; exit 1; }
          echo "Feed now serves client $VERSION with a checksum. The retired Tauri row is superseded."

      # Owner decision A-22 (seven-hills-alpha OWNER-ACTIONS.md): every published build is also a
      # GitHub Release, so the newest installer can be fetched without asking anyone. Last, after
      # the feed read-back, so a release never names a build the feed does not serve. The feed stays
      # the in-app update channel; this is a download page.
      - name: Publish the build as a GitHub Release
        if: steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          INSTALLER: ${{ steps.artifact.outputs.installer }}
        run: |
          set -euo pipefail
          sha=$(sha256sum "dist/$INSTALLER" | cut -d' ' -f1)
          tag="seathub-v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists (a re-run); leaving it as it is."
            exit 0
          fi
          gh release create "$tag" "dist/$INSTALLER" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SeatHub $VERSION" \
            --notes "SeatHub client $VERSION, built from ${GITHUB_SHA::7}. Installer SHA-256: \`$sha\`. The same build the in-app update feed serves."
